name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Validar datasets
        run: npm run validate:data
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Navegador para e2e
        run: npx playwright install --with-deps chromium
      - name: HTML de un solo archivo
        run: npm run build:html
      - name: Pruebas e2e
        run: npm run e2e
      - name: Accesibilidad (axe)
        run: npm run a11y
      - name: Sitio real (Next.js) en segundo plano
        run: |
          npx next start -p 3123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3123/ >/dev/null && break; sleep 2; done
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: e2e y accesibilidad sobre el sitio real
        run: |
          E2E_BASE=http://127.0.0.1:3123 npm run e2e
          A11Y_BASE=http://127.0.0.1:3123 npm run a11y
      - name: Lighthouse (rendimiento y accesibilidad de 95 o más)
        run: LIGHTHOUSE_BASE=http://127.0.0.1:3123 npm run lighthouse
      - name: Pruebas visuales (informativas hasta fijar las capturas en CI)
        run: npm run visual
        continue-on-error: true
      - name: Diferencias visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diferencias-visuales
          path: tests/visual/_diferencias
          if-no-files-found: ignore
